<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Extremely dark, premium minimal background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020106"/>
      <stop offset="60%" stop-color="#070510"/>
      <stop offset="100%" stop-color="#0C061D"/>
    </linearGradient>

    <!-- Blue → Purple Gradient as requested -->
    <linearGradient id="brandText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <!-- Core Clipping Mask: The entire SVG bounding box is cropped by this wave -->
    <!-- Everything outside of this path is completely transparent empty space -->
    <clipPath id="heroWaveMask">
      <path d="M 0,0 L 1600,0 L 1600,320 C 1000,440 600,240 0,330 Z"/>
    </clipPath>
  </defs>

  <!-- The main container uses the clip-path. There are NO elements drawn below the curve. -->
  <g clip-path="url(#heroWaveMask)">
    
    <!-- This rect is mathematically cropped by the wave boundary -->
    <rect width="1600" height="420" fill="url(#bgGrad)"/>
    
    <!-- Ambient Blur Lighting deeply embedded -->
    <circle cx="400" cy="150" r="450" fill="url(#glowBlue)" filter="url(#softBlur)"/>
    <circle cx="1200" cy="240" r="450" fill="url(#glowPurple)" filter="url(#softBlur)"/>
    
  </g>

  <!-- HERO ELEMENT -->
  <text x="800" y="210" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" letter-spacing="16" fill="url(#brandText)">
    PRAGYA IQ
  </text>

  <!-- Subtitle -->
  <text x="800" y="275" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="22" font-weight="300" letter-spacing="2" fill="#F1F5F9" fill-opacity="0.9">
    AI-Powered Business Intelligence &amp; Decision Support Platform
  </text>
</svg>
